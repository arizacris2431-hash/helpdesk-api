spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/helpdesk
    username: postgres
    password: <tu_password_de_postgres>
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

application:
  security:
    jwt:
      secret-key: <tu_clave_jwt>
      expiration: 3600000